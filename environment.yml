# ============================================================================
# Conda environment for SIGLNCOS
# ============================================================================
# Create:  conda env create -f environment.yml
# Activate: conda activate siglncos
# Export:  conda env export > environment_exported.yml
# ============================================================================

name: siglncos

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # R base
  - r-base=4.2.1

  # Core Seurat ecosystem
  - r-seurat=4.2.0
  - r-harmony=0.1.0

  # Data manipulation
  - r-dplyr=1.0.10
  - r-tidyr=1.2.1
  - r-reshape2=1.4.4
  - r-data.table=1.14.6
  - r-tibble=3.1.8

  # Visualization
  - r-ggplot2=3.3.6
  - r-ggstatsplot=0.9.3
  - r-ggthemes=4.2.4
  - r-ggsignif=0.6.4
  - r-gghalves=0.1.3
  - r-pheatmap=1.0.12
  - r-circlize=0.4.15
  - r-complexheatmap=2.14.0
  - r-networkd3=0.4
  - r-plotly=4.10.0
  - r-htmlwidgets=1.5.4
  - r-viridis=0.6.2
  - r-cowplot=1.1.1
  - r-ggrepel=0.9.2

  # Functional enrichment
  - bioconductor-clusterprofiler=4.6.0
  - bioconductor-fgsea=1.24.0
  - bioconductor-enrichplot=1.18.0
  - bioconductor-gsea=1.20.0
  - bioconductor-gsva=1.46.0
  - r-msigdbr=7.5.1

  # Annotation
  - bioconductor-org.hs.eg.db=3.16.0
  - bioconductor-annotationdbi=1.60.0
  - bioconductor-go.db=3.16.0
  - r-rrvgo=1.10.0

  # Statistics
  - r-survival=3.3.1
  - r-survminer=0.4.9
  - r-psych=2.2.9
  - r-desctools=0.99.47
  - r-mclust=6.0.0

  # Graph/Network analysis
  - r-igraph=1.3.5

  # Venn diagrams and UpSet
  - r-venndiagram=1.7.3
  - r-upsetr=1.4.0

  # Utilities
  - r-remotes=2.4.2
  - r-jsonlite=1.8.4
  - r-stringr=1.5.0
  - r-glue=1.6.2
  - r-patchwork=1.1.2

  # Development tools
  - r-devtools=2.4.5

# ============================================================================
# Additional packages (install via R after activation):
# ============================================================================
